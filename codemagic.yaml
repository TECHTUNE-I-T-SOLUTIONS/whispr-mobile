workflows:
  android-release:
    name: Whispr Mobile - Android Release
    # mac_mini_m2 is the machine this account's plan actually includes - every
    # successful build of this app has used it. Linux machines (linux, linux_x2)
    # are rejected at startup with "The selected instance type is not available
    # with the current billing plan."
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.5
      java: 17
      groups:
        # App / API environment variables (unchanged set).
        - whisprmobile
        # Android release signing is NOT referenced here yet.
        #
        # Codemagic validates variable groups statically: naming a group that
        # does not exist fails the whole build before any step runs, with
        # "Codemagic.yaml references to unknown variable group(s)". So the
        # group is added back only once it actually exists in the account.
        #
        # To enable release signing:
        #   1. Codemagic -> app -> Environment variables -> create a group
        #      named exactly whispr_android_signing with these four variables:
        #        ANDROID_KEYSTORE_BASE64  base64 of whispr-release.jks (secure)
        #        KEYSTORE_PASSWORD        keystore (store) password   (secure)
        #        KEY_ALIAS                key alias inside the keystore
        #        KEY_PASSWORD             password for that key alias (secure)
        #   2. Add "- whispr_android_signing" to the groups list above.
        #
        # Until then the "Decode release keystore" step sees an empty
        # ANDROID_KEYSTORE_BASE64, prints a warning and skips, and Gradle
        # falls back to debug keys. The APK installs and runs on a device, but
        # Google Play will reject it.
      vars:
        PACKAGE_NAME: "com.whisprwords.app"
    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Prepare environment files
        script: |
          #!/bin/bash
          set -euo pipefail

          write_env_file() {
            local target_file="$1"
            : > "$target_file"

            for env_key in \
              API_BASE_URL \
              NEXT_PUBLIC_BASE_URL \
              SHARE_BASE_URL \
              NEXT_PUBLIC_WEB_URL \
              GEMINI_API_KEY \
              NEXT_PUBLIC_GEMINI_API_KEY \
              NEXT_PUBLIC_SUPABASE_URL \
              SUPABASE_URL \
              NEXT_PUBLIC_SUPABASE_ANON_KEY \
              SUPABASE_ANON_KEY \
              NEXT_PUBLIC_CONVEX_URL \
              CONVEX_DEPLOYMENT \
              NEXT_PUBLIC_VAPID_PUBLIC_KEY \
              VAPID_PUBLIC_KEY \
              NEXT_PUBLIC_VAPID_REALTIME_PUBLIC_KEY \
              VAPID_REALTIME_PUBLIC_KEY \
              NEXT_PUBLIC_VAPID_REALTIME_PRIVATE_KEY \
              VAPID_REALTIME_PRIVATE_KEY \
              NEXT_PUBLIC_VAPID_REALTIME_SUBJECT \
              VAPID_REALTIME_SUBJECT \
              NEXT_PUBLIC_ELEVENLABS_API_KEY \
              NEXT_PUBLIC_ELEVENLABS_VOICE_ID
            do
              env_value="${!env_key:-}"
              if [ -n "$env_value" ]; then
                printf '%s=%s\n' "$env_key" "$env_value" >> "$target_file"
              fi
            done
          }

          write_env_file .env
          cp .env .env.local

      - name: Decode release keystore
        script: |
          #!/bin/bash
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - falling back to debug signing. Google Play will reject this build."
            exit 0
          fi

          echo "Decoding upload keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/android/whispr-release.jks"

          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=$CM_BUILD_DIR/android/whispr-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          echo "key.properties written"

      - name: Decode google-services.json
        script: |
          #!/bin/bash
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set - building without FCM. Push notifications will be disabled in this build."
            exit 0
          fi

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"
          echo "google-services.json written"

      - name: Get Flutter dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter pub get

      - name: Static analysis
        script: |
          #!/bin/bash
          set -euo pipefail
          flutter analyze --no-fatal-infos

      - name: Build Android Release
        script: |
          #!/bin/bash
          set -euo pipefail

          # Shorebird auth is one-way: create an API key in Shorebird
          # (shorebird tokens create) and store it in Codemagic as
          # SHOREBIRD_TOKEN in the whisprmobile group. Never commit it.
          if [ -z "${SHOREBIRD_TOKEN:-}" ]; then
            echo "::error::SHOREBIRD_TOKEN is missing - add the Shorebird API key to the whisprmobile env group"
            exit 1
          fi

          if ! command -v shorebird >/dev/null 2>&1; then
            curl -fsSL https://shorebird.dev/install.sh | bash
          fi
          export PATH="$HOME/.shorebird/bin:$PATH"
          echo 'export PATH="$HOME/.shorebird/bin:$PATH"' >> "$CM_ENV"
          shorebird --version
          # Do NOT call "shorebird account whoami" here: it is a human-only
          # route and returns service_account_forbidden in CI. The release
          # command below authenticates with SHOREBIRD_TOKEN and validates it.

          # Only one Android release is allowed per version. The APK is
          # what GitHub users install, so Shorebird builds that one and
          # patches can target it. The AAB stays a plain Flutter build
          # until Play signing is configured; it is not patchable.
          shorebird release android --artifact apk --flutter-version=3.41.5
          flutter build appbundle --release

      - name: Publish to GitHub
        script: |
          #!/bin/bash
          set -euo pipefail
          chmod +x ./scripts/create-github-release.sh
          ./scripts/create-github-release.sh
    artifacts:
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - techtune.it.solutions@gmail.com
        notify:
          success: true
          failure: true
