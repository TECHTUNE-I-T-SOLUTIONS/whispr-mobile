# Heap sized for a 16 GB machine. The previous -Xmx8G / MaxMetaspaceSize=4G
# requested 12 GB, so whenever free RAM dipped the daemon JVM failed to start
# and the client reported the misleading "Unable to establish loopback
# connection" error.
# -Djava.net.preferIPv4Stack is required on this machine: the hostname
# (PRINCE-TECHTUNE) resolves to a link-local IPv6 address, and Gradle's
# daemon client then fails with
#   java.net.SocketException: Invalid argument: connect
# which Gradle surfaces as "Unable to establish loopback connection".
# -Djdk.net.unixdomain.tmpdir is required on this machine too. Selector.open()
# builds its wakeup pipe from an AF_UNIX socket pair under that directory, and
# the default (java.io.tmpdir, an 8.3 short path here) makes connect() fail with
# EINVAL. A project-level org.gradle.jvmargs *replaces* the one in
# %GRADLE_USER_HOME%\gradle.properties, so the flag has to be repeated here or
# the build dies with "Unable to establish loopback connection".
# org.gradle.jvmargs is intentionally unset here: the Windows-only flags
# (-Djdk.net.unixdomain.tmpdir=C:/Temp, -Djava.net.preferIPv4Stack=true)
# live in C:/gradle_home/gradle.properties on the local build machine.
# A project-level value would override that file and pass a Windows path
# to Codemagic's macOS build, so leave it unset for CI.

android.useAndroidX=true
android.enableJetifier=true
# org.gradle.offline=true

# Build in-process. Avoids a second JVM on a memory-tight machine.
org.gradle.daemon=false
